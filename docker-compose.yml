services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aluguel_app
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: aluguel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aluguel_temporada
      MYSQL_USER: aluguel
      MYSQL_PASSWORD: aluguel
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: